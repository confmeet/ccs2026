params:
  Name: "2026 NSF CSSI / Cyber Training / SCIPE PI Meeting"
  Description: "Annual PI meeting for the NSF CSSI, CyberTraining, and SCIPE programs."
  Date: "Sept. 13 - 15, 2026"
  Venue: "Bethesda North Marriott Hotel & Conference Center"
  Address: "5701 Marinelli Road"
  City: "Rockville"
  State: "MD"
  Images: ["/img/badge.jpg"]
  GoogleMapsKey: "AIzaSyDGEz9K7S1Dj9RdZk1UT44s4R9iWj1yB7k"

  Sections:
    - about
    - speakers
    - schedule
    - registration
    - posters
    - location

  Titles:
    about: "About"
    speakers: "Speakers"
    schedule: "Program (Tentative)"
    registration: "Registration"
    posters: "Posters"
    location: "Venue & Travel"

  CallToAction:
    text: "Register"
    link: "https://www.cavs.msstate.edu/conferences/2026NSFCyberPI/register/"

  # Session assignments lookup page (rendered at /assignments/).
  # Data comes from a CSV committed to the repo with the columns:
  #   surname,name,breakout,poster,doi
  # `csv` is a path relative to the top-level assets/ directory,
  # i.e. "data/assignments.csv" means the file assets/data/assignments.csv
  # Main floor map (PDF), linked at the top of the Program section
  MainFloorMap: "/pdf/main-floor-map.pdf"

  Assignments:
    title: "Session Assignments"
    csv: "data/assignments.csv"
    link_text: "View My Assignments"
    description: "Find your name below to see which breakout session and which poster session you have been assigned to, and whether we have received the DOI for your archived poster."
    empty: "Assignments are not yet available. Please check back closer to the meeting."
    missing_doi_text: "MISSING. Please complete this form to submit your DOI."
    updated: "September 10, 2026"

  # About section body (supports Markdown)
  About:
    body: |
      The annual NSF CSSI, CyberTraining, and SCIPE PI Meeting brings together principal investigators and senior personnel funded under these programs to share progress, exchange ideas, and build community across the cyberinfrastructure research ecosystem.

  # Registration details
  Registration:
    deadline: "August 20, 2026"
    information: "Registration is open to NSF CSSI, CyberTraining, and SCIPE PIs, co-PIs and senior personnel. Each project or collaborative project is only required to be represented by just one person. Exceptions should be discussed with the cognizant NSF program manager. A representative of a project under No Cost Extension is encouraged to join, but not required."
    instructions: "Register here."

  # Poster session details
  PosterSession:
    description: "All projects or collaborative projects must be represented with a poster."
    instructions:
      title_abstract: "Poster titles and abstracts must be submitted during registration. The registration links on this site will take you to a form and contain instructions for submitting titles and abstracts for a variety of situations."
      configuration: "Posters should be no larger than 3ft (vertically) by 3ft (horizontally), and should be thin and light enough to be pierced by a tack and affixed to a cork board. Cork boards and tacks will be provided."
      printing: "Presenters should print their posters and bring them to the conference, or print them at a local vendor in time for the conference. We will not provide a list of local print vendors."
      example_CI_text: "is an example poster from a CyberInfrastructure project."
      example_CI_link: "https://doi.org/10.6084/m9.figshare.26801080.v1"
      example_CSSI_text: "is an example poster from a CSSI project." 
      example_CSSI_link: "https://doi.org/10.6084/m9.figshare.24107424.v1"
      archiving: "In addition to printing and presenting a physical poster, you must archive a digitial version of your poster on FigShare and share your DOI with us. Instructions for doing so are available in the "
      submission_link: "https://docs.google.com/forms/d/e/1FAIpQLSd83SfhqRv9E2WM8qUfgkkKdfTo6nxbQAWOXMxwnVrP7-ju-A/viewform?usp=dialog"
    deadline: "September 11, 2026 at 11:59pm ET."
    sessions: ""


  # Venue & Travel details
  Location:
    hotel:
      name: "Bethesda North Marriott Hotel & Conference Center"
      url: "https://www.marriott.com/en-us/hotels/wasbn-bethesda-north-marriott-hotel-and-conference-center"
      booking_link: "https://book.passkey.com/e/51306602"
      booking_deadline: "August 20, 2026"
      rate: "249.00 per night plus taxes and fees"
      notes: "A room block has been reserved for conference attendees at a discounted rate. To take advantage of the rate use"
    map_link: "/pdf/venue-birdseye-map.pdf"
    travel: |
      **By Air:** The nearest airports are Ronald Reagan Washington National Airport (~20 miles), Washington Dulles International Airport (~25 miles), and Baltimore/Washington International (~35 miles).

      **By Metro from Downtown DC:** Take the Red Line to the North Bethesda Station. The hotel is approximately a 5-minute walk from the station exit.
    parking_map_link: "/pdf/parking-map.pdf"
  # Childcare details
  Childcare:
    description: "Childcare services will be available for registered attendees with young children. Please contact the organizers to arrange childcare."
    contact: "TBD"
    deadline: "TBD"

  # Multi-day program — add/remove Day blocks as needed.
  # Each Day has a name and its own schedule array.
  # Entries with a `presentation` key appear in both the Speakers and Program sections.
  Days:
    - name: "Sunday, Sept. 13"
      schedule:
        - name: "Welcome Reception"
          description: "Please join us in Strathmore (lower level) for a welcome reception. Hors d'oeuvres will be served."
          time: "5:00pm"
    - name: "Monday, Sept. 14"
      schedule:
        - name: "Registration & Breakfast"
          description: "Please join us in the Grand Ballroom (Salons F-H) to register and have breakfast."
          time: "7:45am"
        - name: "Prof. Neeraj Rai" 
          photo: "/img/speakers/neeraj-rai.jpg"
          bio: "Neeraj Rai is the Ergon, Inc. Distinguished Professor in the Dave C. Swalm School of Chemical Engineering and the Center for Advanced Vehicular Systems at Mississippi State University. His research integrates molecular modeling, high-performance computing, data science, and machine learning to study interfacial molecular science for catalysis and to design and develop optoelectronic materials. He also develops computational tools and training resources that broaden access to advanced computing and enable data- and computation-intensive research. He led the establishment of i-CoMSE, the NSF-supported Institute for Computational Molecular Science Education, which trains the next generation of scientists and engineers in computational molecular science and engineering."
          company: "Mississippi State University"
          link:
            href: "https://www.che.msstate.edu/people/faculty/neeraj-rai/"
            text: "(Website)"
          presentation:
            title: "Opening Remarks"
            description: "Prof. Rai will deliver opening remarks in the Grand Ballroom (Salon E)."
            time: "8:45am"
        - name: "Dr. Irina Dolinskaya"
          photo: "/img/speakers/irina-dolinskaya.jpg"
          bio: "Irina Dolinskaya, Ph.D., is directorate head for the U.S National Science Foundation Computer and Information Science and Engineering (NSF CISE) Directorate at the U.S. National Science Foundation (NSF). Prior to becoming a directorate head, she served as a deputy division director in NSF’s Computing and Communication Foundations division, and as program director in NSF’s Division of Civil, Mechanical & Manufacturing Innovation. Prior to joining NSF, Irina Dolinskaya was a faculty in the Industrial Engineering and Management Sciences department at Northwestern University. She obtained M.S. and Ph.D. degrees in Industrial and Operations Engineering from the University of Michigan, and a B.S. degree in Industrial Engineering from the University of Florida."
          company: "National Science Foundation"
          link:
            href: "https://www.linkedin.com/in/irina-dolinskaya-a777627/"
            text: "(LinkedIn)"
          presentation:
            title: "CISE updates and strategic directions"
            description: "Grand Ballroom (Salon E). Leadership from the NSF CISE directorate will discuss major updates and priority directions for the directorate."
            time: "9:00am"
            co_presenters: ["Dr. Amy Walton"]
        - name: "Dr. Amy Walton"
          photo: "/img/speakers/amy-walton.jpg"
          bio: "Amy Walton is the Deputy Directorate Head for the Directorate for Computer and Information Science and Engineering (CISE). Prior to her current role, she was a Program Director in the Office of Advanced Cyberinfrastructure, contributing to several cross-foundational activities in which NSF has a leadership role: Harnessing the Data Revolution, emphasizing data-intensive research in science and engineering; enabling Quantum Leap, through foundries for quantum materials science, engineering and information; Cyberinfrastructure for Sustained Scientific Innovation, focused upon the availability and interoperability of science data cyberinfrastructure; and EarthCube, an integrated geoscience research program."
          company: "National Science Foundation"
          presentation:
            skip_program_row: true
        - name: "Dr. Benjamin Brown"
          photo: "/img/speakers/ben-brown.jpg"
          bio: "Dr. Benjamin (Ben) Brown is the Director of the Facilities Division in the U.S. Department of Energy’s Office of Science, Advanced Scientific Computing Research program. Ben leads and executes the conception, construction, and operation of DOE’s world-leading research supercomputing, data, and networking infrastructure to enable the DOE mission and the national research enterprise.  Ben is the federal executive lead for the American Science Cloud, the open science infrastructure for the Genesis Mission Platform, and is the lead architect of the Department’s Integrated Research Infrastructure effort to achieve seamless interoperability of experimental, observational, computational, network, and data infrastructure.  Ben has been a member of the federal Senior Executive Service since 2020.  He has over twenty years of government service with extensive experience in research infrastructure strategy, budget formulation, risk management, and project management.  He is a Ph.D. experimental physicist with specialization in ultrafast optics, ultracold atomic physics, and quantum information science."
          company: "Department of Energy"
          link:
            href: "https://science.osti.gov/ascr/About/Staff"
            text: "(Contact)"
          presentation:
            title: "An Update on the Genesis Mission Platform"
            description: "Grand Ballroom (Salon E).  Since the Administration announced the Genesis Mission in November 2025, the DOE Office of Science Advanced Scientific Computing Research (ASCR) program has advanced the strategy and implementation approach to the Genesis Mission Platform: the federated computing, data, and networking infrastructure that will enable integrated AI workflows.  This presentation will provide a status update on these efforts, and specifically address our ambitions for the Genesis Platform in the contexts of AI, HPC, and Quantum Information Science."
            time: "9:30am"
        - name: "Break"
          time: "10:00am"
        - name: "Poster Session I" 
          time: "10:15am"
          description: "Grand Ballroom (Salons A-D). Check your assignments to see if you are presenting."
        - name: "Lunch"
          time: "11:45am"
          description: "Please join us in the Grand Ballroom (Salons F-H) for lunch."
        - name: "Poster Session II" 
          time: "12:45pm"
          description: "Grand Ballroom (Salons A-D). Check your assignments to see if you are presenting."
        - name: "Break"
          time: "2:15pm"
        - name: "Breakout Sessions"
          time: "2:30pm"
          description: "Check your assignments to see your breakout session and its room. All rooms are on the lower level."
          map_link: "/pdf/breakout-rooms-map.pdf"
        - name: "Break" 
          time: "4:15pm"
        - name: "Poster Session III" 
          time: "4:30pm"
          description: "Grand Ballroom (Salons A-D). Check your assignments to see if you are presenting."
        - name: "Main Reception"
          time: "6:00pm"
          description: "Please join us for a reception in the Grand Ballroom (Salons A-D) following the poster session. Hors d'oeuvres will be served."

    - name: "Tuesday, Sept. 15"
      schedule:
        - name: "Registration & Breakfast"
          time: "8:00am"
          description: "Please join us in the Grand Ballroom (Salons F-H) for breakfast. The registration table will still be available for late arrivals."
        - name: "Dir. Katie Antypas"
          photo: "/img/speakers/katie-antypas.jpg"
          company: "National Science Foundation"
          bio: "Katie Antypas is NSF’s Director of the Office of Advanced Cyberinfrastructure which supports the development and deployment of advanced data, computing, and networking infrastructure, as well as the software, tools, services, and training for the research community. It is also the Office responsible for the launch and deployment of the National AI Research Resource (NAIRR) Pilot. Prior to joining NSF Katie spent 17 years at Lawrence Berkeley National Laboratory at the National Energy Research Scientific Computing Center in a variety of leadership roles leading the deployment of large-scale high-performance computing systems and supporting the scientific research community using them. She has an M.S. in CS from the University of Chicago and a Bachelor degree in Physics from Wellesley College."
          link:
            href: "https://www.nsf.gov/cise/office-advanced-cyberinfrastructure"
            text: "(OAC Website)"
          presentation:
            title: "Update from the NSF Office of Advanced Cyberinfrastructure"
            time: "9:00am"
            description: "Grand ballroom (Salon E). In this talk Dir. Antypas will highlight new programs and recent awards relevant to the Cyberinfrastructure community."
        - name: "Prof. Kenneth Merz"
          photo: "/img/speakers/kenneth-merz.jpg"
          company: "Cleveland Clinic"
          bio: "Kenneth M. Merz Jr., Ph.D. is a Quantum Molecular Scientist in the Center for Computational Life Sciences at Cleveland Clinic. His research interests include computational chemistry, molecular simulation, drug discovery, and quantum computing applications in the life sciences. Prior to joining Cleveland Clinic, he served as a University Distinguished Professor and the Joseph Zichis Chair in Chemistry at Michigan State University and held faculty appointments at the University of Florida and Pennsylvania State University. Dr. Merz is Editor-in-Chief of the Journal of Chemical Information and Modeling and has authored more than 400 scientific publications."
          link:
            href: "https://www.lerner.ccf.org/computational-medicine/merz/"
            text: "(Website)"
          presentation: 
            title: "Applications of Quantum Computers in Chemistry" 
            description: "Grand Ballroom (Salon E). Computing hardware has long followed Moore’s Law; however, its steady gains in computational performance are expected to plateau in the coming years. As a result, the computer hardware industry is actively exploring new paradigms to sustain performance growth. Quantum computing offers a promising pathway, though current quantum hardware remains limited by significant noise, necessitating effective error mitigation strategies. Recently, IBM introduced subspace quantum diagonalization (SQD), a method for solving electronic structure problems relevant to chemistry. SQD exemplifies the emerging paradigm of quantum-centric supercomputing (QCSC), in which quantum processors are deployed for targeted subproblems while classical hardware manages the remaining computational workload. In this presentation, I will review the theoretical foundations of the SQD method and highlight its applications in chemistry, including the study of intermolecular interactions, calculations on large drug-like molecules and biomolecules, the incorporation of solvation effects, and the integration of SQD with statistical mechanical approaches."
            time: "9:30am" 
        - name: "Breakout Reports"
          time: "10:00am"
          description: "Grand Ballroom (Salon E). Speakers from each breakout section will report on their respective sessions and findings."
        - name: "Poster Session IV"
          time: "11:00am" 
          description: "Grand Ballroom (Salons A-D). Check your assignments to see if you are presenting."
        - name: "Prof. Alan Sussman"
          photo: "/img/speakers/alan-sussman.jpg"
          bio: "Alan Sussman is a Professor in the Department of Computer Science at the University of Maryland, College Park, where he also serves as the Associate Chair for Undergraduate Education. He previously served as a Program Director at the NSF within the CISE Directorate. He focuses on parallel and distributed systems, high-performance computing, and computer science education."
          company: "University of Maryland, College Park"
          link:
            href: "https://www.cs.umd.edu/~als/"
            text: "(Website)"
          presentation:
            title: "Closing Remarks"
            description: "Prof. Sussman will deliver closing remarks in the Grand Ballroom (Salon E)"
            time: "12:30pm"
        - name: "Lunch"
          time: "12:45pm"
          description: "Please join us in the Grand Ballroom (Salons F-H) for lunch."
        - name: "Meeting adjourned"
          time: "1:45pm"
          description: "Thank you for joining the PI meeting. Please travel safely."
